name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl-dev libx11-dev libxcursor-dev libxi-dev libxkbcommon-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-xcb-dev libjack-jackd2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo test
        run: cargo test --all-features

      - name: Check detector and complete callback allocations
        run: cargo test --no-default-features --features analysis-normalization

      - name: cargo check
        run: cargo check

      - name: cargo check --no-default-features
        run: cargo check --no-default-features

      - name: cargo check --features gui
        run: cargo check --features gui

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  build:
    name: Build (${{ matrix.os-name }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os-name: windows
          - os: macos-latest
            os-name: macos
          - os: ubuntu-latest
            os-name: linux

    steps:
      - uses: actions/checkout@v6

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl-dev libx11-dev libxcursor-dev libxi-dev libxkbcommon-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-xcb-dev libjack-jackd2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Bundle Release Artifacts
        run: cargo xtask bundle trace_tuner --release --features gui

      - name: Install pluginval
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install pluginval -y --no-progress

          $pluginval = @(
            (Get-Command pluginval.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -First 1),
            "C:\ProgramData\chocolatey\bin\pluginval.exe",
            "C:\ProgramData\chocolatey\lib\pluginval\tools\pluginval.exe"
          ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1

          if (-not $pluginval) {
            throw "pluginval.exe was not found after Chocolatey install"
          }

          Split-Path -Parent $pluginval | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "PLUGINVAL_EXE=$pluginval" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate VST3 with pluginval
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          & "$env:PLUGINVAL_EXE" `
            --validate-in-process `
            --strictness-level 5 `
            --output-dir pluginval-logs `
            --validate target\bundled\TraceTuner.vst3

      - name: Prepare Artifacts
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Could not read package version" }
          $version = ($metadata.packages | Where-Object name -eq trace_tuner).version
          New-Item -ItemType Directory -Force -Path dist/TraceTuner | Out-Null
          Copy-Item -Recurse -Force "target/bundled/TraceTuner.vst3" "dist/TraceTuner/TraceTuner.vst3"
          Copy-Item -Recurse -Force "target/bundled/TraceTuner.clap" "dist/TraceTuner/TraceTuner.clap"
          Copy-Item README.md, CHANGELOG.md, LICENSE -Destination dist/TraceTuner
          Compress-Archive -Path dist/TraceTuner -DestinationPath "dist/TraceTuner_v${version}_${{ matrix.os-name }}.zip" -Force

      - name: Upload pluginval logs
        if: always() && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: windows-pluginval-logs
          path: pluginval-logs/**
          if-no-files-found: ignore

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os-name }}-zip
          path: dist/*.zip

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: output
          pattern: '*-zip'
          merge-multiple: true

      - name: Prepare changelog and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import re
          import tomllib

          version = tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          tag = os.environ['RELEASE_TAG']
          if tag != f'v{version}':
              raise SystemExit(f'Tag {tag} does not match package version {version}')
          changelog = Path('CHANGELOG.md').read_text()
          entry = re.search(rf'(?ms)^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)', changelog)
          if not entry:
              raise SystemExit(f'Missing changelog entry for {version}')
          Path('release-notes.md').write_text(entry.group(1).strip() + '\n')
          archives = sorted(Path('output').glob('*.zip'))
          expected = {f'TraceTuner_v{version}_{platform}.zip' for platform in ('windows', 'macos', 'linux')}
          if {archive.name for archive in archives} != expected:
              raise SystemExit(f'Expected all three platform archives: {sorted(expected)}')
          checksums = ''.join(f'{hashlib.sha256(archive.read_bytes()).hexdigest()}  {archive.name}\n' for archive in archives)
          Path('output/SHA256SUMS.txt').write_text(checksums)
          PY

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Trace Tuner ${{ github.ref_name }}
          files: |
            output/*.zip
            output/SHA256SUMS.txt
          body_path: release-notes.md
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          overwrite_files: true
